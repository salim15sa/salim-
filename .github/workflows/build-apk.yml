name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TaxiLog.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaxiLog-apk
          path: TaxiLog.apk

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TaxiLog.apk \
            --title "Taxi Log (build ${{ github.run_number }})" \
            --notes "Download TaxiLog.apk on your phone and install it. Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}." \
            --target "${{ github.sha }}" --prerelease
